name: ニュース更新

on:
  # サイト表示の「7時・11時・14時・17時更新」に間に合うよう、その23分前に取得する
  # （GitHub は毎時0分に実行が集中して遅延・欠落しやすいので、0分は避けている）
  schedule:
    - cron: "37 21 * * *"  # 毎日 6:37 JST
    - cron: "37 1 * * *"   # 毎日 10:37 JST
    - cron: "37 4 * * *"   # 毎日 13:37 JST
    - cron: "37 7 * * *"   # 毎日 16:37 JST
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_news.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # 新着通知の宛先（未設定なら通知しない）。通知のリンク先は config.json の site_url

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json stats/feed_log.csv
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
